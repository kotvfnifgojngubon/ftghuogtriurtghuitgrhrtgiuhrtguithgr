<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cerveau du projet</title>
<style>
  :root { --bg: #04060d; --panel: #0a1020; --line: rgba(110, 170, 255, 0.18); --ink: #d8e6ff; --muted: #7f95bd; --accent: #5aa8ff; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #wrap { display: flex; height: 100%; }
  #view { position: relative; flex: 1; min-width: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  canvas.drag { cursor: grabbing; }
  #side { width: 340px; background: linear-gradient(180deg, #0b1224, #070b16); border-left: 1px solid var(--line); display: flex; flex-direction: column; }
  #side h2 { font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: #a9c4ef; margin: 18px 18px 10px; }
  #search { margin: 0 18px 10px; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line); background: #060a14; color: var(--ink); font: inherit; font-size: 13px; }
  #list { overflow: auto; flex: 1; padding: 0 10px 14px; }
  .row { display: grid; grid-template-columns: 20px 12px 1fr auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 6px; font-size: 13.5px; cursor: pointer; }
  .row:hover { background: rgba(90, 168, 255, 0.07); }
  .row input { accent-color: var(--accent); margin: 0; }
  .dot { width: 11px; height: 11px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }
  .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  #hud { position: absolute; left: 16px; top: 14px; pointer-events: none; }
  #hud h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: 0.02em; text-shadow: 0 0 18px rgba(90, 168, 255, 0.6); }
  #hud p { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; }
  #tip { position: absolute; pointer-events: none; background: rgba(6, 12, 26, 0.94); border: 1px solid rgba(110, 170, 255, 0.35); border-radius: 6px; padding: 7px 10px; font-size: 12.5px; max-width: 360px; box-shadow: 0 0 24px rgba(40, 120, 255, 0.25); }
  #tip b { display: block; font-size: 13.5px; }
  #tip span { color: var(--muted); }
  @media (max-width: 760px) { #wrap { flex-direction: column; } #side { width: 100%; height: 38%; border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<div id="wrap">
  <div id="view">
    <canvas id="c"></canvas>
    <div id="hud"><h1>Cerveau du projet</h1><p id="stats"></p><p>Molette : zoom · Glisser : déplacer · Clic sur un neurone : ses connexions</p></div>
    <div id="tip" hidden></div>
  </div>
  <aside id="side">
    <h2>Aires (communautés)</h2>
    <input id="search" type="search" placeholder="Chercher un neurone…" aria-label="Chercher un neurone">
    <div id="list"></div>
  </aside>
</div>
<script>
const D = /*__DATA__*/null;
const PAL = ['#4da3ff', '#6ec6ff', '#2f7bff', '#9cc4ff', '#3fd0ff', '#7a8cff', '#5ee0f0', '#b8dcff', '#3a5bff', '#8fe9ff', '#5d7dff', '#2bb6ff'];
const colorOf = (c) => PAL[c % PAL.length];
const N = D.nodes.length;
const visible = new Array(D.comms.length).fill(true);
const adj = Array.from({ length: N }, () => []);
for (const [a, b] of D.edges) { adj[a].push(b); adj[b].push(a); }
document.getElementById('stats').textContent = `${N.toLocaleString('fr')} neurones · ${D.edges.length.toLocaleString('fr')} synapses · ${D.comms.length} aires`;

// ---------- liste des aires ----------
const list = document.getElementById('list');
const all = document.createElement('label');
all.className = 'row';
all.innerHTML = '<input type="checkbox" checked><span></span><span class="name">Tout sélectionner</span><span></span>';
list.append(all);
const boxes = [];
D.comms.forEach(([name, n], i) => {
  const row = document.createElement('label');
  row.className = 'row';
  row.innerHTML = `<input type="checkbox" checked><span class="dot" style="background:${colorOf(i)};color:${colorOf(i)}"></span><span class="name"></span><span class="n">${n}</span>`;
  row.querySelector('.name').textContent = name;
  row.querySelector('.name').title = name;
  const cb = row.querySelector('input');
  cb.onchange = () => { visible[i] = cb.checked; dirty = true; };
  boxes.push(cb);
  list.append(row);
});
all.querySelector('input').onchange = (e) => { boxes.forEach((b, i) => { b.checked = e.target.checked; visible[i] = e.target.checked; }); dirty = true; };

// ---------- vue ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const layer = document.createElement('canvas');
const lctx = layer.getContext('2d');
let W = 0, H = 0, dpr = 1;
const cam = { x: 0, y: 0, s: 1 };
let dirty = true, focus = -1, hover = -1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  for (const c of [cv, layer]) { c.width = W * dpr; c.height = H * dpr; }
  if (!resize.done) { cam.s = Math.min(W / 1450, H / 1150); resize.done = true; }
  dirty = true;
}
window.addEventListener('resize', resize);
resize();
const sx = (x) => (x - cam.x) * cam.s + W / 2;
const sy = (y) => (y - cam.y) * cam.s + H / 2;
const rad = (d) => Math.min(9, 1.3 + Math.sqrt(d) * 0.7);

function curve(c, x1, y1, x2, y2) {
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1;
  const cx = mx - dy * 0.18, cy = my + dx * 0.18;
  c.moveTo(x1, y1);
  c.quadraticCurveTo(cx, cy, x2, y2);
  return [cx, cy];
}

function drawStatic() {
  const c = lctx;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.globalCompositeOperation = 'source-over';
  const g = c.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
  g.addColorStop(0, '#0a1430'); g.addColorStop(1, '#03050b');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  // silhouette du cerveau
  c.beginPath();
  D.outline.forEach(([x, y], i) => (i ? c.lineTo(sx(x), sy(y)) : c.moveTo(sx(x), sy(y))));
  c.closePath();
  c.fillStyle = 'rgba(40, 90, 200, 0.05)'; c.fill();
  c.strokeStyle = 'rgba(110, 170, 255, 0.22)'; c.lineWidth = 1.5; c.shadowColor = '#3a7bff'; c.shadowBlur = 18; c.stroke();
  c.shadowBlur = 0;
  c.beginPath(); c.moveTo(sx(0), sy(-470)); c.bezierCurveTo(sx(-12), sy(-150), sx(12), sy(150), sx(0), sy(470));
  c.strokeStyle = 'rgba(110, 170, 255, 0.12)'; c.stroke();
  // synapses
  c.globalCompositeOperation = 'lighter';
  const focusSet = focus >= 0 ? new Set([focus, ...adj[focus]]) : null;
  c.lineWidth = Math.max(0.5, 0.7 * Math.min(1.6, cam.s));
  c.beginPath();
  for (const [a, b] of D.edges) {
    const A = D.nodes[a], B = D.nodes[b];
    if (!visible[A[2]] || !visible[B[2]]) continue;
    if (focusSet && !(a === focus || b === focus)) continue;
    curve(c, sx(A[0]), sy(A[1]), sx(B[0]), sy(B[1]));
  }
  c.strokeStyle = focusSet ? 'rgba(140, 200, 255, 0.55)' : 'rgba(90, 160, 255, 0.2)';
  c.stroke();
  // neurones
  for (let i = 0; i < N; i++) {
    const n = D.nodes[i];
    if (!visible[n[2]]) continue;
    const x = sx(n[0]), y = sy(n[1]);
    if (x < -20 || y < -20 || x > W + 20 || y > H + 20) continue;
    const r = rad(n[3]) * Math.min(2.2, Math.max(0.6, cam.s));
    const dim = focusSet && !focusSet.has(i);
    const col = colorOf(n[2]);
    c.globalAlpha = dim ? 0.12 : 1;
    const gg = c.createRadialGradient(x, y, 0, x, y, r * 3.2);
    gg.addColorStop(0, col); gg.addColorStop(0.35, col + '66'); gg.addColorStop(1, col + '00');
    c.fillStyle = gg;
    c.beginPath(); c.arc(x, y, r * 3.2, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#e8f3ff';
    c.beginPath(); c.arc(x, y, r * 0.45, 0, Math.PI * 2); c.fill();
  }
  c.globalAlpha = 1;
  // étiquettes des grands neurones (ou des voisins du neurone choisi)
  c.globalCompositeOperation = 'source-over';
  c.font = '12px system-ui, sans-serif';
  c.fillStyle = 'rgba(220, 235, 255, 0.92)';
  c.shadowColor = '#000'; c.shadowBlur = 4;
  const minDeg = cam.s > 3 ? 4 : cam.s > 1.8 ? 14 : 48;
  for (let i = 0; i < N; i++) {
    const n = D.nodes[i];
    if (!visible[n[2]]) continue;
    if (focusSet ? !focusSet.has(i) : n[3] < minDeg) continue;
    const x = sx(n[0]), y = sy(n[1]);
    if (x < 0 || y < 0 || x > W || y > H) continue;
    c.fillText(n[4].length > 34 ? n[4].slice(0, 32) + '…' : n[4], x + 7, y - 6);
  }
  c.shadowBlur = 0;
}

// ---------- influx nerveux ----------
const sparks = [];
function spawn() {
  for (let k = 0; k < 30; k++) {
    const e = D.edges[(Math.random() * D.edges.length) | 0];
    if (focus >= 0 && e[0] !== focus && e[1] !== focus) continue;
    if (!visible[D.nodes[e[0]][2]] || !visible[D.nodes[e[1]][2]]) continue;
    sparks.push({ e, t: 0, v: 0.5 + Math.random() * 0.9, rev: Math.random() < 0.5 });
    return;
  }
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (dirty) { drawStatic(); dirty = false; }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(layer, 0, 0);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const target = focus >= 0 ? 40 : 260;
  while (sparks.length < target) spawn();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.t += dt * s.v;
    if (s.t >= 1) { sparks.splice(i, 1); continue; }
    let [a, b] = s.e; if (s.rev) [a, b] = [b, a];
    const A = D.nodes[a], B = D.nodes[b];
    const x1 = sx(A[0]), y1 = sy(A[1]), x2 = sx(B[0]), y2 = sy(B[1]);
    const cx = (x1 + x2) / 2 - (y2 - y1) * 0.18 * (s.rev ? -1 : 1), cy = (y1 + y2) / 2 + (x2 - x1) * 0.18 * (s.rev ? -1 : 1);
    const t = s.t, u = 1 - t;
    const x = u * u * x1 + 2 * u * t * cx + t * t * x2, y = u * u * y1 + 2 * u * t * cy + t * t * y2;
    const a2 = Math.sin(Math.PI * t);
    const g = ctx.createRadialGradient(x, y, 0, x, y, 7);
    g.addColorStop(0, `rgba(210, 240, 255, ${a2})`); g.addColorStop(1, 'rgba(60, 150, 255, 0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- interactions ----------
function pick(mx, my) {
  let best = -1, bd = 14 * 14;
  for (let i = 0; i < N; i++) {
    const n = D.nodes[i];
    if (!visible[n[2]]) continue;
    const dx = sx(n[0]) - mx, dy = sy(n[1]) - my, d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}
const tip = document.getElementById('tip');
let drag = null;
cv.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, moved: false }; cv.setPointerCapture(e.pointerId); cv.classList.add('drag'); });
cv.addEventListener('pointermove', (e) => {
  const r = cv.getBoundingClientRect();
  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
    cam.x -= dx / cam.s; cam.y -= dy / cam.s;
    drag.x = e.clientX; drag.y = e.clientY; dirty = true;
    return;
  }
  const i = pick(e.clientX - r.left, e.clientY - r.top);
  if (i !== hover) {
    hover = i;
    if (i < 0) { tip.hidden = true; return; }
    const n = D.nodes[i];
    tip.innerHTML = '';
    const b = document.createElement('b'); b.textContent = n[4];
    const s = document.createElement('span'); s.textContent = `${D.comms[n[2]][0]} · ${n[3]} connexions`;
    const f = document.createElement('div'); f.style.color = '#7f95bd'; f.textContent = D.files[n[5]];
    tip.append(b, s, f);
    tip.hidden = false;
  }
  if (!tip.hidden) { tip.style.left = `${e.clientX - r.left + 14}px`; tip.style.top = `${e.clientY - r.top + 14}px`; }
});
cv.addEventListener('pointerup', (e) => {
  cv.classList.remove('drag');
  if (drag && !drag.moved) {
    const r = cv.getBoundingClientRect();
    const i = pick(e.clientX - r.left, e.clientY - r.top);
    focus = i === focus ? -1 : i;
    sparks.length = 0; dirty = true;
  }
  drag = null;
});
cv.addEventListener('wheel', (e) => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const wx = (mx - W / 2) / cam.s + cam.x, wy = (my - H / 2) / cam.s + cam.y;
  cam.s = Math.max(0.2, Math.min(12, cam.s * Math.exp(-e.deltaY * 0.0015)));
  cam.x = wx - (mx - W / 2) / cam.s; cam.y = wy - (my - H / 2) / cam.s;
  dirty = true;
}, { passive: false });
document.getElementById('search').addEventListener('change', (e) => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) { focus = -1; dirty = true; return; }
  let best = -1;
  for (let i = 0; i < N; i++) if (D.nodes[i][4].toLowerCase().includes(q) && (best < 0 || D.nodes[i][3] > D.nodes[best][3])) best = i;
  if (best >= 0) { focus = best; cam.x = D.nodes[best][0]; cam.y = D.nodes[best][1]; cam.s = Math.max(cam.s, 2.5); sparks.length = 0; dirty = true; }
});
</script>
</body>
</html>

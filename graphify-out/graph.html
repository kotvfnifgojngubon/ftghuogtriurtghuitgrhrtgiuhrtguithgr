<title>Graphe du jeu</title>
<style>
:root{--bg:#f6f7fa;--panel:#ffffff;--ink:#1b1f27;--mute:#5d6676;--line:#d7dbe3;--edge:rgba(60,70,90,.16);--edgeH:#d0661a;--acc:#2f6fd6;--in:#2f8f5b;--out:#c0511a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1218;--panel:#171b23;--ink:#e6e9ef;--mute:#98a1b2;--line:#2a303c;--edge:rgba(170,185,210,.14);--edgeH:#ff9a4a;--acc:#6ea8ff;--in:#5ccf8f;--out:#ff9a4a}}
:root[data-theme="dark"]{--bg:#0f1218;--panel:#171b23;--ink:#e6e9ef;--mute:#98a1b2;--line:#2a303c;--edge:rgba(170,185,210,.14);--edgeH:#ff9a4a;--acc:#6ea8ff;--in:#5ccf8f;--out:#ff9a4a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h1{font-size:17px;margin:0 12px 0 0}.stat{color:var(--mute);font-size:13px}
input{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);min-width:220px;flex:1;max-width:360px}
button{font:inherit;padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);cursor:pointer}button.on{border-color:var(--acc);color:var(--acc)}

#side h2{font-size:15px;margin:0 0 4px}#side h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:16px 0 6px}
#side ul{list-style:none;margin:0;padding:0}#side li{padding:3px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;cursor:pointer}#side li:hover{color:var(--acc)}
.k{color:var(--mute);font-size:12px;white-space:nowrap}code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
text{fill:var(--ink);font-size:11px;pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:3px}
.hint{color:var(--mute);font-size:13px}

const pal=d3.quantize(t=>d3.interpolateRainbow(t*0.92+0.02),G.sections.length);

const dl=document.getElementById('names');for(const n of [...G.nodes].sort((a,b)=>a.id.localeCompare(b.id))){const o=document.createElement('option');o.value=n.id;dl.appendChild(o);}
const svg=d3.select('#g'),side=document.getElementById('side');let sim=null;
function size(){const r=svg.node().getBoundingClientRect();return [r.width||800,r.height||600];}
function li(name,k,fn){const e=document.createElement('li');e.innerHTML='<code>'+name+'</code><span class="k">'+k+'</span>';e.onclick=fn;return e;}
function clear(){if(sim)sim.stop();svg.selectAll('*').remove();}
// vue 1 : sections reliées par leurs appels
function viewSections(){document.getElementById('bSec').classList.add('on');clear();const [W,H]=size();
  const N=G.sections.map((s,i)=>({i,name:s.name,count:s.count,r:6+Math.sqrt(s.count)*2.6}));
  const L=G.secEdges.filter(e=>e[2]>=2).map(e=>({source:e[0],target:e[1],w:e[2]}));
  const g=svg.append('g');svg.call(d3.zoom().scaleExtent([0.3,4]).on('zoom',e=>g.attr('transform',e.transform)));
  const le=g.append('g').selectAll('line').data(L).join('line').attr('stroke',css('--edge')).attr('stroke-width',d=>Math.min(6,0.6+Math.sqrt(d.w)*0.6));
  const ne=g.append('g').selectAll('circle').data(N).join('circle').attr('r',d=>d.r).attr('fill',d=>pal[d.i]).attr('stroke',css('--bg')).attr('stroke-width',1.5).style('cursor','pointer')
    .on('mouseenter',(e,d)=>{le.attr('stroke',l=>l.source===d||l.target===d?css('--edgeH'):css('--edge'));}).on('mouseleave',()=>le.attr('stroke',css('--edge'))).on('click',(e,d)=>showSection(d.i));
  ne.append('title').text(d=>d.name+' — '+d.count+' fonctions');
  const te=g.append('g').selectAll('text').data(N).join('text').text(d=>d.name.length>34?d.name.slice(0,32)+'…':d.name).attr('dy',d=>-d.r-3).attr('text-anchor','middle');
  sim=d3.forceSimulation(N).force('l',d3.forceLink(L).distance(d=>90/Math.sqrt(d.w)+40).strength(d=>Math.min(0.6,0.05+d.w/80))).force('c',d3.forceManyBody().strength(-260)).force('x',d3.forceX(W/2).strength(0.05)).force('y',d3.forceY(H/2).strength(0.07)).force('k',d3.forceCollide(d=>d.r+14))
    .on('tick',()=>{le.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);ne.attr('cx',d=>d.x).attr('cy',d=>d.y);te.attr('x',d=>d.x).attr('y',d=>d.y);});
  ne.call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y;}).on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y;}).on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=d.fy=null;}));
  side.innerHTML='<h2>Sections du fichier</h2><p class="hint">Chaque disque est une section du code (taille : nombre de fonctions). Un trait relie deux sections dont les fonctions s’appellent (au moins 2 liens). Clique une section pour voir ses fonctions, ou cherche une fonction en haut.</p><h3>Sections par taille</h3>';
  const ul=document.createElement('ul');for(const d of [...N].sort((a,b)=>b.count-a.count))ul.appendChild(li(d.name,d.count+' f.',()=>showSection(d.i)));side.appendChild(ul);}
// panneau d'une section : ses fonctions et ses liens avec les autres sections
function showSection(i){const F=G.nodes.filter(n=>n.s===i).sort((a,b)=>(callers.get(b.id).length+callees.get(b.id).length)-(callers.get(a.id).length+callees.get(a.id).length));
  const out=G.secEdges.filter(e=>e[0]===i).sort((a,b)=>b[2]-a[2]),inn=G.secEdges.filter(e=>e[1]===i).sort((a,b)=>b[2]-a[2]);
  side.innerHTML='<h2>'+G.sections[i].name+'</h2><p class="hint">'+F.length+' fonctions. Clique une fonction pour voir qui l’appelle et ce qu’elle appelle.</p>';
  const add=(t,arr,fn)=>{const h=document.createElement('h3');h.textContent=t;side.appendChild(h);const ul=document.createElement('ul');arr.forEach(x=>ul.appendChild(fn(x)));side.appendChild(ul);};
  add('Fonctions (les plus reliées d’abord)',F.slice(0,200),n=>li(n.id,'l. '+n.l+' · '+(callers.get(n.id).length)+'↙ '+(callees.get(n.id).length)+'↗',()=>viewFn(n.id)));
  add('Appelle surtout',out.slice(0,10),e=>li(G.sections[e[1]].name,e[2]+' liens',()=>showSection(e[1])));
  add('Appelée surtout par',inn.slice(0,10),e=>li(G.sections[e[0]].name,e[2]+' liens',()=>showSection(e[0])));}
// vue 2 : une fonction, ses appelants (à gauche) et ce qu'elle appelle (à droite)
function viewFn(id){const n=byId.get(id);if(!n)return;document.getElementById('bSec').classList.remove('on');clear();const [W,H]=size();
  const ci=callers.get(id),co=callees.get(id),g=svg.append('g');svg.call(d3.zoom().scaleExtent([0.3,4]).on('zoom',e=>g.attr('transform',e.transform)));
  const col=(arr,x)=>arr.map((m,k)=>({id:m,x,y:arr.length<2?H/2:40+k*(H-80)/(arr.length-1)}));
  const L=col(ci.slice(0,60),W*0.18),R=col(co.slice(0,60),W*0.82),C={id,x:W/2,y:H/2};
  const link=(a,b,c)=>g.append('path').attr('d','M'+a.x+','+a.y+' C'+(a.x+b.x)/2+','+a.y+' '+(a.x+b.x)/2+','+b.y+' '+b.x+','+b.y).attr('fill','none').attr('stroke',c).attr('stroke-opacity',0.5);
  L.forEach(p=>link(p,C,css('--in')));R.forEach(p=>link(C,p,css('--out')));
  const dot=(p,r,c)=>{g.append('circle').attr('cx',p.x).attr('cy',p.y).attr('r',r).attr('fill',c).style('cursor','pointer').on('click',()=>viewFn(p.id)).append('title').text(p.id+' — '+secName(byId.get(p.id).s));};
  L.forEach(p=>{dot(p,5,pal[byId.get(p.id).s]||'#888');g.append('text').attr('x',p.x-9).attr('y',p.y+4).attr('text-anchor','end').text(p.id);});
  R.forEach(p=>{dot(p,5,pal[byId.get(p.id).s]||'#888');g.append('text').attr('x',p.x+9).attr('y',p.y+4).text(p.id);});
  dot(C,11,pal[n.s]||'#888');g.append('text').attr('x',C.x).attr('y',C.y-17).attr('text-anchor','middle').style('font-size','14px').style('font-weight','600').text(id);
  if(ci.length>60||co.length>60)g.append('text').attr('x',W/2).attr('y',H-10).attr('text-anchor','middle').text('affichage limité à 60 de chaque côté');
  side.innerHTML='<h2><code>'+id+'</code></h2><p class="hint">'+secName(n.s)+' · ligne '+n.l+' du script · '+n.n+' lignes</p>';
  const add=(t,arr)=>{const h=document.createElement('h3');h.textContent=t+' ('+arr.length+')';side.appendChild(h);const ul=document.createElement('ul');arr.forEach(m=>ul.appendChild(li(m,secName(byId.get(m).s).slice(0,28),()=>viewFn(m))));side.appendChild(ul);};
  add('Appelée par',ci);add('Appelle',co);
  const b=document.createElement('button');b.textContent='Voir sa section';b.style.marginTop='14px';b.onclick=()=>{viewSections();showSection(n.s);};side.appendChild(b);}
document.getElementById('bSec').onclick=viewSections;
document.getElementById('q').addEventListener('change',e=>{if(byId.has(e.target.value))viewFn(e.target.value);});
viewSections();
</script></body></html>
